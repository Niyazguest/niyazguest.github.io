<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="style.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  </head>
  <body>

<form class="red-form" onsubmit="return false;">
        <h2 class="form-title">Вызов</h2>
        
        <!-- Первое поле: Расширяемое текстовое -->
        <div class="form-group">
            <label for="reason-text">Повод</label>
            <textarea id="reason-text" placeholder="Опишите повод в свободной форме..."></textarea>
        </div>

        <!-- Второе поле: Поиск с выпадающим списком -->
        <div class="form-group">
            <label for="reason-search">Повод</label>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="reason-search" class="search-input" placeholder="Начните вводить для поиска..." autocomplete="off">
                <ul class="dropdown" id="dropdown-list"></ul>
            </div>
        </div>
         <div id="map"></div>
    </form>


<script>
  const testData = [
            "День рождения", 
            "Свадьба", 
            "Юбилей", 
            "Годовщина отношений",
            "Выпускной", 
            "Корпоратив", 
            "Новый год", 
            "8 Марта",
            "23 Февраля", 
            "Повышение на работе", 
            "Рождение ребенка",
            "Новоселье", 
            "Проводы на пенсию", 
            "Защита диплома",
            "День Святого Валентина"
        ];

        const searchInput = document.getElementById('reason-search');
        const dropdownList = document.getElementById('dropdown-list');

        // Обработчик ввода текста в поле поиска
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            dropdownList.innerHTML = ''; // Очищаем список

            // Если поле пустое, скрываем список
            if (query.length === 0) {
                dropdownList.style.display = 'none';
                return;
            }

            // Фильтруем тестовые данные
            const filteredData = testData.filter(item => item.toLowerCase().includes(query));

            // Если есть совпадения, показываем список
            if (filteredData.length > 0) {
                filteredData.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    
                    // При клике на элемент списка подставляем значение в поле
                    li.addEventListener('click', function() {
                        searchInput.value = item;
                        dropdownList.style.display = 'none';
                    });
                    
                    dropdownList.appendChild(li);
                });
                dropdownList.style.display = 'block';
            } else {
                dropdownList.style.display = 'none';
            }
        });

        // Скрываем выпадающий список при клике вне поля поиска
        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !dropdownList.contains(e.target)) {
                dropdownList.style.display = 'none';
            }
        });

  function send(e) {
    console.log(e);
    window.Telegram.WebApp.sendData(JSON.stringify({t: e.latlng}));
  }


var map = L.map('map');

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);


map.setView([55.5, 55.5], 12);
L.marker([55.5, 55.5]).addTo(map);

map.on('click', send);


</script>
  </body>
</html>
